<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/">
      <span class="brand-mark">FS</span>
      <span>FashionStore <small>SaaS</small></span>
    </a>

    <nav>
      @if (auth.isAuthenticated()) {
        <a routerLink="/profile">Mi perfil</a>
        <button type="button" class="nav-button" (click)="logout()">Salir</button>
      } @else {
        <a routerLink="/login">Ingresar</a>
        <a class="nav-cta" routerLink="/register">Registrarse</a>
      }
    </nav>
  </header>

  <main>
    <router-outlet />
  </main>

  <footer>
    <span>FashionStore SaaS · Segundo parcial</span>
    <span>Sistemas de Informacion II · Grupo 33</span>
  </footer>
</div>
